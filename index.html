<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#161719"
  >

  <title>Painel de Estudos</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main class="app">

    <!-- =========================================
         CABEÇALHO
    ========================================== -->

    <header class="header">

      <div>

        <span class="kicker">
          ESTUDOS
        </span>

        <h1>
          Meu progresso
        </h1>

        <p
          class="date"
          id="currentDate"
        ></p>

      </div>


      <label
        class="import-button"
        for="xlsxInput"
      >
        Atualizar planilha
      </label>

      <input
        type="file"
        id="xlsxInput"
        accept=".xlsx,.xls"
        hidden
      >

    </header>


    <!-- =========================================
         HOJE
    ========================================== -->

    <section class="today">

      <div class="today__content">

        <span class="today__label">
          HOJE
        </span>

        <h2 id="todayTitle">
          Carregando…
        </h2>

        <p id="todayDescription">
          Preparando sua rotina.
        </p>

      </div>


      <div
        class="today__action"
        id="todayAction"
      ></div>

    </section>


    <!-- =========================================
         RESUMO
    ========================================== -->

    <section class="summary">

      <article class="summary__progress">

        <div class="summary__progress-top">

          <span>
            Progresso geral
          </span>

          <strong id="overallPercent">
            0%
          </strong>

        </div>

        <div class="global-progress">

          <span
            id="globalProgressBar"
          ></span>

        </div>

        <small id="overallDescription">
          0 de 0 aulas
        </small>

      </article>


      <article class="summary__number">

        <span>
          Concluídas
        </span>

        <strong id="completedTotal">
          0
        </strong>

      </article>


      <article class="summary__number">

        <span>
          Restantes
        </span>

        <strong id="remainingTotal">
          0
        </strong>

      </article>

    </section>


    <!-- =========================================
         TEMAS
    ========================================== -->

    <section class="section">

      <header class="section__header">

        <div>

          <span class="kicker">
            ÁREAS
          </span>

          <h2>
            Temas
          </h2>

        </div>

        <p>
          Visão geral do avanço em cada área.
        </p>

      </header>


      <div
        class="theme-grid"
        id="themeGrid"
      ></div>

    </section>


    <!-- =========================================
         DISCIPLINAS
    ========================================== -->

    <section class="section">

      <header class="section__header">

        <div>

          <span class="kicker">
            DETALHAMENTO
          </span>

          <h2>
            Disciplinas
          </h2>

        </div>

        <span
          class="counter"
          id="subjectCount"
        ></span>

      </header>


      <div
        class="subject-grid"
        id="subjectGrid"
      ></div>

    </section>


    <!-- =========================================
         RODAPÉ
    ========================================== -->

    <footer class="footer">

      <span id="dataStatus">
        Dados salvos neste navegador.
      </span>

      <button
        type="button"
        id="resetProgress"
      >
        Zerar progresso
      </button>

    </footer>

  </main>


  <!-- =========================================
       TOAST
  ========================================== -->

  <div
    class="toast"
    id="toast"
    aria-live="polite"
  >

    <span id="toastMessage"></span>

    <button
      type="button"
      id="toastUndo"
    >
      Desfazer
    </button>

  </div>


  <!-- =========================================
       BIBLIOTECAS
  ========================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"
  ></script>

  <script src="app.js"></script>

</body>

</html>
